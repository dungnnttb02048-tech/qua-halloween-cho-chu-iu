<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎃 Halloween từ Cháu gửi Chú 🎃</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff9f1c;
    --deep: #ff6b00;
    --purple: #c77dff;
    --pink: #ff6b9d;
    --dark: #0a0412;
    --card-bg: linear-gradient(160deg, rgba(45,20,75,0.95) 0%, rgba(80,30,55,0.92) 50%, rgba(110,45,20,0.9) 100%);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 30% 20%, #1a0b2e 0%, #0a0412 55%, #050208 100%);
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Patrick Hand', cursive;
    color: #fff;
    cursor: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== CUSTOM CURSOR + TRAIL ===== */
  .cursor {
    position: fixed;
    width: 30px;
    height: 30px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.08s ease-out;
    will-change: transform;
  }
  .cursor svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 8px var(--orange));
  }
  .cursor.clicked {
    transform: translate(-50%, -50%) scale(0.75);
  }

  .trail {
    position: fixed;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff6b9d, transparent 70%);
    pointer-events: none;
    z-index: 9998;
    opacity: 0.75;
    transform: translate(-50%, -50%);
    transition: opacity 0.35s, transform 0.35s;
  }

  /* Canvas FX */
  #fx {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Moon */
  .moon {
    position: fixed;
    top: 36px;
    right: 48px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle at 32% 32%, #fffde7, #ffeb3b 48%, #f9a825);
    border-radius: 50%;
    box-shadow:
      0 0 50px #ffeb3b,
      0 0 100px rgba(255,235,59,0.35),
      0 0 160px rgba(255,159,28,0.15);
    z-index: 2;
    animation: moonGlow 6s ease-in-out infinite alternate;
  }
  .moon::after {
    content: '';
    position: absolute;
    top: 16px; left: 20px;
    width: 26px; height: 26px;
    background: rgba(10,4,18,0.28);
    border-radius: 50%;
  }
  @keyframes moonGlow {
    from { box-shadow: 0 0 50px #ffeb3b, 0 0 100px rgba(255,235,59,0.35); }
    to   { box-shadow: 0 0 70px #ffeb3b, 0 0 140px rgba(255,235,59,0.45); }
  }

  /* Header */
  .header {
    text-align: center;
    padding: 38px 20px 6px;
    position: relative;
    z-index: 20;
  }
  .header h1 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: clamp(2.1rem, 5.2vw, 3.3rem);
    color: #ffb347;
    text-shadow: 0 0 28px rgba(255,159,28,0.55);
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 1.22rem;
    color: #e0b0ff;
    margin-top: 6px;
    opacity: 0.95;
  }

  /* ===== LETTER CARD 3D ===== */
  .letter-wrap {
    max-width: 660px;
    margin: 28px auto;
    padding: 0 16px;
    perspective: 1400px;
    position: relative;
    z-index: 20;
  }

  .letter-box {
    background: var(--card-bg);
    border-radius: 26px;
    padding: 52px 40px 38px;
    position: relative;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 28px 55px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,159,28,0.2),
      inset 0 1px 0 rgba(255,255,255,0.12);
    transform-style: preserve-3d;
    transition: transform 0.12s ease-out;
    will-change: transform;
  }

  .letter-box::before {
    content: '🎃';
    position: absolute;
    top: -36px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 3.5rem;
    filter: drop-shadow(0 6px 16px rgba(255,159,28,0.6));
    animation: pumpkinBob 2.8s ease-in-out infinite;
  }
  @keyframes pumpkinBob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
  }

  .letter-content {
    font-size: 1.24rem;
    line-height: 1.88;
    color: #f8f0ff;
    text-align: center;
    min-height: 240px;
  }
  .letter-content .hl {
    color: #ffb347;
    font-weight: 600;
    text-shadow: 0 0 14px rgba(255,179,71,0.5);
  }

  .signature {
    margin-top: 26px;
    font-size: 1.38rem;
    color: #ffb347;
    text-align: right;
    opacity: 0;
    transition: opacity 1.3s ease;
  }
  .signature.show { opacity: 1; }

  /* Floating lanterns */
  .lantern {
    position: absolute;
    font-size: 1.85rem;
    opacity: 0.72;
    animation: floatLantern 5.8s ease-in-out infinite;
    z-index: 15;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(255,159,28,0.4));
  }
  @keyframes floatLantern {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
  }

  /* Pumpkins row */
  .pumpkins {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 40px auto 18px;
    max-width: 880px;
    position: relative;
    z-index: 20;
    padding: 0 12px;
  }

  .pumpkin {
    width: 100px;
    height: 92px;
    cursor: pointer;
    transition: transform 0.28s cubic-bezier(0.34, 1.45, 0.64, 1);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.45));
    animation: bob 3.1s ease-in-out infinite;
    will-change: transform;
  }
  .pumpkin:nth-child(2) { animation-delay: 0.35s; }
  .pumpkin:nth-child(3) { animation-delay: 0.7s; }
  .pumpkin:nth-child(4) { animation-delay: 1.05s; }
  .pumpkin:nth-child(5) { animation-delay: 1.4s; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .pumpkin:hover,
  .pumpkin:active {
    transform: scale(1.18) rotate(-7deg) !important;
    animation-play-state: paused;
    filter: drop-shadow(0 10px 20px rgba(255,159,28,0.35));
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.35);
    background: rgba(18,8,35,0.97);
    border: 1.5px solid rgba(255,159,28,0.6);
    border-radius: 22px;
    padding: 24px 36px;
    font-size: 1.35rem;
    color: #fff;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-align: center;
    max-width: 380px;
    width: calc(100% - 40px);
    box-shadow: 0 22px 55px rgba(0,0,0,0.5), 0 0 30px rgba(255,159,28,0.12);
    backdrop-filter: blur(12px);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Music button */
  .music-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(145deg, #ff9f1c, #ff6b00);
    border: none;
    font-size: 1.55rem;
    cursor: pointer;
    z-index: 50;
    box-shadow: 0 6px 22px rgba(255,107,0,0.5);
    transition: transform 0.22s, box-shadow 0.22s;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .music-btn:hover { transform: scale(1.1); }
  .music-btn:active { transform: scale(0.95); }
  .music-btn.playing {
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,159,28,0.55); }
    70% { box-shadow: 0 0 0 16px rgba(255,159,28,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,159,28,0); }
  }

  /* Volume tip */
  .music-tip {
    position: fixed;
    bottom: 90px;
    right: 18px;
    background: rgba(20,10,40,0.92);
    color: #ffb347;
    font-size: 0.85rem;
    padding: 8px 14px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
    z-index: 49;
    border: 1px solid rgba(255,159,28,0.3);
  }
  .music-tip.show { opacity: 1; }

  .footer {
    text-align: center;
    padding: 10px 20px 100px;
    color: #c9a0dc;
    font-size: 1.06rem;
    position: relative;
    z-index: 20;
  }
  .footer small {
    opacity: 0.7;
    display: block;
    margin-top: 4px;
  }

  /* Loading state for typewriter */
  .cursor-blink::after {
    content: '|';
    animation: blink 0.7s step-end infinite;
    color: #ffb347;
    margin-left: 2px;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  @media (max-width: 600px) {
    .letter-box { padding: 44px 20px 30px; }
    .letter-content { font-size: 1.1rem; line-height: 1.8; }
    .pumpkin { width: 82px; height: 76px; }
    .moon { width: 90px; height: 90px; top: 24px; right: 20px; }
    .music-btn { bottom: 18px; right: 18px; width: 52px; height: 52px; }
    body { cursor: auto; }
    .cursor, .trail { display: none !important; }
  }

  @media (hover: none) {
    body { cursor: auto; }
    .cursor, .trail { display: none !important; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor">
  <svg viewBox="0 0 100 100">
    <ellipse cx="50" cy="55" rx="42" ry="38" fill="#ff9f1c"/>
    <rect x="45" y="12" width="10" height="16" rx="3" fill="#2d5a27"/>
    <ellipse cx="35" cy="48" rx="7" ry="9" fill="#1a0b2e"/>
    <ellipse cx="65" cy="48" rx="7" ry="9" fill="#1a0b2e"/>
    <path d="M40 68 Q50 78 60 68" stroke="#1a0b2e" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<canvas id="fx"></canvas>
<div class="moon"></div>

<div class="header">
  <h1>🎃 Happy Halloween 🎃</h1>
  <p>Từ cháu gửi đến chú yêu của cháu</p>
</div>

<div class="letter-wrap">
  <div class="letter-box" id="letterBox">
    <div class="letter-content cursor-blink" id="letterText"></div>
    <div class="signature" id="signature">— Cháu của chú ❤️🎃</div>
  </div>
</div>

<!-- Lanterns -->
<div class="lantern" style="top:16%; left:5%; animation-delay:0s">🏮</div>
<div class="lantern" style="top:26%; right:6%; animation-delay:1.1s">🏮</div>
<div class="lantern" style="top:52%; left:3.5%; animation-delay:2.3s">🏮</div>
<div class="lantern" style="top:60%; right:4.5%; animation-delay:0.7s">🏮</div>

<div class="pumpkins" id="pumpkins"></div>

<div class="footer">
  Click vào bí ngô để nhận lời nhắn ngọt ngào từ cháu 💕<br>
  <small>Made with all my love • Dành riêng cho chú</small>
</div>

<div class="toast" id="toast"></div>
<button class="music-btn" id="musicBtn" aria-label="Bật/tắt nhạc">🎵</button>
<div class="music-tip" id="musicTip">Nhấn để bật nhạc Halloween 🎵</div>

<!-- Nhạc ambient Halloween (Archive.org – CORS mở, free to use) -->
<audio id="bgMusic" loop preload="auto" crossorigin="anonymous">
  <source src="https://dn710004.ca.archive.org/0/items/halloween-2023-creative-commons-music/01%20-%20Humanfobia%20-%20Pamela%27s%20Vorhees%20Head%20%5BCrypt%20Hop%20Mix%5D.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== Cursor + Trail (desktop only) ===== */
const isTouch = matchMedia('(hover: none), (pointer: coarse)').matches;
const cursor = document.getElementById('cursor');
const trails = [];
const maxTrails = 12;

if (!isTouch) {
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';

    if (trails.length > maxTrails) {
      const old = trails.shift();
      old.remove();
    }
    const t = document.createElement('div');
    t.className = 'trail';
    t.style.left = e.clientX + 'px';
    t.style.top  = e.clientY + 'px';
    document.body.appendChild(t);
    trails.push(t);
    requestAnimationFrame(() => {
      t.style.opacity = '0';
      t.style.transform = 'translate(-50%,-50%) scale(0.2)';
    });
    setTimeout(() => t.remove(), 380);
  });

  document.addEventListener('mousedown', () => cursor.classList.add('clicked'));
  document.addEventListener('mouseup', () => cursor.classList.remove('clicked'));
}

/* ===== 3D Card tilt (desktop) ===== */
const letterBox = document.getElementById('letterBox');
if (!isTouch) {
  document.addEventListener('mousemove', e => {
    const x = (e.clientX / window.innerWidth  - 0.5) * 14;
    const y = (e.clientY / window.innerHeight - 0.5) * -11;
    letterBox.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
  });
  document.addEventListener('mouseleave', () => {
    letterBox.style.transform = 'rotateY(0deg) rotateX(0deg)';
  });
}

/* ===== Typewriter – giữ nguyên nội dung ===== */
const fullText = `Chú yêu ơi,<br><br>
Halloween năm nay, cháu không hóa trang thành ma quỷ đáng sợ…<br>
Mà hóa thành <span class="hl">cháu yêu cục vàng của chú</span>.<br><br>
Cháu muốn “trick” chú bằng những nụ hôn ngọt ngào,<br>
và “treat” chú bằng cả trái tim bé nhỏ này của cháu.<br><br>
Chú là quả bí ngô ngọt nhất trong đời cháu, mà cháu được ông tơ bà nguyệt ban tặng trong cuộc sống<br>
là ngôi nhà ma ấm áp mà cháu muốn về mãi mãi.<br><br>
Dù đêm nay có bao nhiêu con ma bay lượn ngoài bầu trời,<br>
cháu chỉ sợ mỗi một điều…<br>
là không được ở bên chú thuiiiii óoooo.<br><br>
<span class="hl">Cháu yêu chú rất nhiều, rất rất nhiều luôn á.</span><br>
Forever & always, ngay cả trong đêm đáng sợ nhất.`;

const letterEl = document.getElementById('letterText');
let idx = 0;
function typeWriter() {
  if (idx < fullText.length) {
    if (fullText[idx] === '<') {
      const end = fullText.indexOf('>', idx);
      letterEl.innerHTML += fullText.substring(idx, end + 1);
      idx = end + 1;
    } else {
      letterEl.innerHTML += fullText[idx];
      idx++;
    }
    setTimeout(typeWriter, 22);
  } else {
    letterEl.classList.remove('cursor-blink');
    document.getElementById('signature').classList.add('show');
  }
}
setTimeout(typeWriter, 600);

/* ===== Pumpkins – giữ nguyên 6 lời nhắn ===== */
const pumpkinsBox = document.getElementById('pumpkins');
const msgs = [
  "🎃 Chú là treat ngọt nhất đời cháu!",
  "👻 Boo… cháu yêu chú nhiều lắm đó!",
  "🧡 Halloween này cháu chỉ muốn ôm chú thôi.",
  "🍬 Chú có muốn nhận thêm một nụ hôn từ cháu không?",
  "✨ Dù hóa thành ma, cháu vẫn chỉ muốn ở bên chú.",
  "💜 Cháu thuộc về chú… mãi mãi."
];

function createPumpkin(i) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 120 110');
  svg.classList.add('pumpkin');
  svg.setAttribute('role', 'button');
  svg.setAttribute('aria-label', 'Bí ngô số ' + (i + 1));
  svg.innerHTML = `
    <defs>
      <radialGradient id="g${i}" cx="40%" cy="38%" r="60%">
        <stop offset="0%" stop-color="#ffb347"/>
        <stop offset="100%" stop-color="#e65c00"/>
      </radialGradient>
    </defs>
    <ellipse cx="60" cy="62" rx="48" ry="42" fill="url(#g${i})"/>
    <rect x="54" y="14" width="12" height="18" rx="4" fill="#2d5a27"/>
    <ellipse cx="42" cy="52" rx="8" ry="10" fill="#1a0b2e"/>
    <ellipse cx="78" cy="52" rx="8" ry="10" fill="#1a0b2e"/>
    <path d="M52 58 L60 68 L68 58" fill="#1a0b2e"/>
    <path d="M40 75 Q60 92 80 75" stroke="#1a0b2e" stroke-width="6" fill="none" stroke-linecap="round"/>
  `;
  svg.addEventListener('click', () => {
    showToast(msgs[i % msgs.length]);
    burst(svg.getBoundingClientRect());
  });
  pumpkinsBox.appendChild(svg);
}
for (let i = 0; i < 5; i++) createPumpkin(i);

/* ===== Toast ===== */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3400);
}

/* ===== Canvas FX (stars + fireflies + falling + ghosts + bats) ===== */
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let W, H, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width  = innerWidth  * dpr;
  H = canvas.height = innerHeight * dpr;
  canvas.style.width  = innerWidth  + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

const particles = [];
const fireflies = [];
const ghosts = [];
const bats = [];

// stars
for (let i = 0; i < 60; i++) {
  particles.push({
    x: Math.random() * 2000,
    y: Math.random() * 1200,
    r: Math.random() * 1.4 + 0.3,
    a: Math.random() * 6,
    speed: Math.random() * 0.014 + 0.003,
    type: 'star'
  });
}

// fireflies
for (let i = 0; i < 16; i++) {
  fireflies.push({
    x: Math.random() * 1800,
    y: Math.random() * 900,
    r: Math.random() * 2.1 + 1,
    phase: Math.random() * 10,
    speed: Math.random() * 0.38 + 0.18
  });
}

// falling hearts / candies
function addFall() {
  particles.push({
    x: Math.random() * innerWidth,
    y: -25,
    vy: Math.random() * 1.4 + 0.9,
    vx: (Math.random() - 0.5) * 0.55,
    size: Math.random() * 7 + 11,
    rot: Math.random() * 6,
    rotSpeed: (Math.random() - 0.5) * 0.045,
    emoji: Math.random() > 0.45 ? '❤️' : '🍬',
    life: 1,
    type: 'fall'
  });
}
setInterval(addFall, 620);

// ghosts
for (let i = 0; i < 4; i++) {
  ghosts.push({
    x: Math.random() * 1600,
    y: Math.random() * 600 + 70,
    size: Math.random() * 20 + 26,
    vx: (Math.random() - 0.5) * 0.4,
    phase: Math.random() * 8
  });
}

// bats
for (let i = 0; i < 5; i++) {
  bats.push({
    x: Math.random() * 1500,
    y: Math.random() * 380 + 35,
    size: Math.random() * 14 + 13,
    speed: Math.random() * 1.3 + 0.9,
    phase: Math.random() * 7
  });
}

function burst(rect) {
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  for (let i = 0; i < 16; i++) {
    particles.push({
      x: cx,
      y: cy,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12 - 3.5,
      r: Math.random() * 3.8 + 2,
      color: ['#ff9f1c','#ff6b00','#ff6b9d','#c77dff','#ffeb3b'][Math.floor(Math.random()*5)],
      life: 1,
      type: 'burst'
    });
  }
}

function draw() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  // subtle fog
  ctx.fillStyle = 'rgba(25,12,45,0.025)';
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  // stars
  particles.forEach(p => {
    if (p.type === 'star') {
      p.a += p.speed;
      ctx.beginPath();
      ctx.arc(p.x % innerWidth, p.y % innerHeight, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${0.18 + Math.sin(p.a) * 0.42})`;
      ctx.fill();
    }
  });

  // fireflies
  fireflies.forEach(f => {
    f.phase += 0.028;
    f.x += Math.sin(f.phase) * f.speed;
    f.y += Math.cos(f.phase * 0.68) * f.speed * 0.55;
    if (f.x < -10) f.x = innerWidth + 10;
    if (f.x > innerWidth + 10) f.x = -10;

    const alpha = 0.35 + Math.sin(f.phase * 2.1) * 0.4;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 220, 90, ${alpha})`;
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ffd700';
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // falling + burst
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.type === 'fall') {
      p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed; p.life -= 0.0032;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.font = `${p.size}px serif`;
      ctx.fillText(p.emoji, 0, 0);
      ctx.restore();
      if (p.y > innerHeight + 40 || p.life <= 0) particles.splice(i, 1);
    } else if (p.type === 'burst') {
      p.x += p.vx; p.y += p.vy; p.vy += 0.17; p.life -= 0.018;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ghosts
  ghosts.forEach(g => {
    g.phase += 0.015;
    g.x += g.vx;
    g.y += Math.sin(g.phase) * 0.48;
    if (g.x < -50) g.x = innerWidth + 30;
    if (g.x > innerWidth + 50) g.x = -30;
    ctx.globalAlpha = 0.7;
    ctx.font = `${g.size}px serif`;
    ctx.fillText('👻', g.x, g.y);
  });

  // bats
  bats.forEach(b => {
    b.x += b.speed;
    b.y += Math.sin(b.phase + b.x * 0.0065) * 1.0;
    if (b.x > innerWidth + 35) {
      b.x = -25;
      b.y = Math.random() * 360 + 35;
    }
    ctx.globalAlpha = 0.78;
    ctx.font = `${b.size}px serif`;
    ctx.fillText('🦇', b.x, b.y);
  });

  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

/* ===== Music – xử lý autoplay policy đúng cách ===== */
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
const musicTip = document.getElementById('musicTip');
let isPlaying = false;

bgMusic.volume = 0.45;

// Hiện tip lần đầu
setTimeout(() => musicTip.classList.add('show'), 1800);
setTimeout(() => musicTip.classList.remove('show'), 6500);

musicBtn.addEventListener('click', async () => {
  musicTip.classList.remove('show');
  try {
    if (!isPlaying) {
      await bgMusic.play();
      isPlaying = true;
      musicBtn.classList.add('playing');
      musicBtn.textContent = '🔊';
    } else {
      bgMusic.pause();
      isPlaying = false;
      musicBtn.classList.remove('playing');
      musicBtn.textContent = '🎵';
    }
  } catch (err) {
    console.warn('Music play blocked:', err);
    musicTip.textContent = 'Nhấn lại nút để bật nhạc nhé 🎵';
    musicTip.classList.add('show');
    setTimeout(() => musicTip.classList.remove('show'), 4000);
  }
});

// Tự pause khi tab ẩn (tiết kiệm pin)
document.addEventListener('visibilitychange', () => {
  if (document.hidden && isPlaying) {
    bgMusic.pause();
  } else if (!document.hidden && isPlaying) {
    bgMusic.play().catch(() => {});
  }
});
</script>
